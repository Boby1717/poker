	/*	GESTION DES FLIP CARD	*/
.GreenColor {cursor: pointer; color: #0f8437;}

.flip-box {
  background-color: transparent;
  width: 101px;
  height: 189px;
  perspective: 1000px;
}

.flip-box-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.8s;
  transform-style: preserve-3d;
}

.flipcard {
  transform: rotateY(180deg);
}

.flip-box-front, .flip-box-back {
  position: absolute;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}

.flip-box-front {
  background-color: white;
}

.flip-box-back {
  background-color: white;
  transform: rotateY(180deg);

<script type="text/javascript">
function Show2s() {

	var GOP3 = document.getElementById("GOP3");
	var StatContainer = document.getElementById("Stat-container");
	var RESET = document.getElementById("RESET");
	var StatTexte = document.getElementById("Stat-texte");


const divWithClassExists = document.querySelectorAll(
                            'div.Mini-2s'
                           ).length > 0;

if (divWithClassExists) {

	var MiniCard = document.getElementById("Mini-2s");
	MiniCard.parentNode.removeChild(MiniCard)
}

else {

	if ( GOP3.style.display.match("block") && RESET.style.display.match("none") ) {
	GOP3.style.display = "none";
	StatContainer.style.display = "block";
	StatTexte.style.display = "block";
	RESET.style.display = "block";
	
	StatContainer.innerHTML += "<div class='mini-Black Mini-2s' id='Mini-2s' onclick='Show2s(); flip2s();' title='SUPPRIMER'><img class='Mini_Cards' src='Mini_Cards/2s.png'/></div>";
	
	var ButtonContainer = document.getElementById("Button-Container");
	ButtonContainer.innerHTML = "<button id='RESET' class='RESET' onclick='RESET();' style='display:block;'>RESET</button>";
	}
	
	else {
	StatContainer.innerHTML += "<div class='mini-Black Mini-2s' id='Mini-2s' onclick='Show2s(); flip2s();' title='SUPPRIMER'><img class='Mini_Cards' src='Mini_Cards/2s.png'/></div>";

	var ButtonContainer = document.getElementById("Button-Container");
	ButtonContainer.innerHTML = "<button id='RESET' class='RESET' onclick='RESET();' style='display:block;'>RESET</button>";
	}	
}

};

<script type="text/javascript"> // Aller sur le player Winamax avec un délais
        function scrollToBottomWithDelay() {
            const myWinAmaxIframe = document.getElementById('myWinAmax');
            const scrollTarget = document.getElementById('scrollTarget');
            const clubsCard = document.getElementById('clubs-card');

            if (!myWinAmaxIframe || !scrollTarget || !clubsCard) return;

            // Toggle : afficher ou cacher l'iframe
            const isVisible = myWinAmaxIframe.classList.contains('visible');
            if (isVisible) {
                myWinAmaxIframe.classList.remove('visible');
                setTimeout(() => {
                    clubsCard.scrollIntoView({ behavior: 'smooth', block: 'end' }); // Défile vers clubs-card quand invisible
                }, 500); // Attendre la fin de la transition (0.5s)
            } else {
                // Charger l'URL seulement au premier affichage
                if (!myWinAmaxIframe.src) {
                    myWinAmaxIframe.src = myWinAmaxIframe.dataset.src;
                }
                myWinAmaxIframe.classList.add('visible');
                setTimeout(() => {
                    scrollTarget.scrollIntoView({ behavior: 'smooth', block: 'end' }); // Défile vers scrollTarget quand visible
                }, 500); // Attendre la fin de la transition (0.5s)
            }
        }
</script>
